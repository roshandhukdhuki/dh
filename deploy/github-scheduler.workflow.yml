# INACTIVE TEMPLATE: keep outside .github/workflows until production authentication is documented and approved.
# Temporary Sites test/bypass tokens must never be used as the production service secret.
name: Artha cloud discovery
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artha-cloud-discovery
  cancel-in-progress: false
jobs:
  tick:
    if: vars.ARTHA_ENABLE_SCHEDULER == 'true' && github.repository == 'roshandhukdhuki/dh' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run due private discovery and verify persistence
        env:
          ARTHA_SITE_ORIGIN: ${{ secrets.ARTHA_SITE_ORIGIN }}
          ARTHA_PRODUCTION_SERVICE_TOKEN: ${{ secrets.ARTHA_PRODUCTION_SERVICE_TOKEN }}
          ARTHA_PRODUCTION_AUTH_APPROVED: ${{ vars.ARTHA_PRODUCTION_AUTH_APPROVED }}
        run: python3 scripts/cloud_tick.py
